<style>/* OpenWeights brand: same fonts and colours as the production site (Playfair Display, Raleway, Red Hat Mono; forest, coral, amber, plum). */
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--surface-2:#F2ECE4;--hl:#FFF5ED;--line:#E6DED3;--line-2:#D3C8B9;
  --ink:#1E2E28;--ink-2:#3B4A44;--muted:#6B756F;
  --forest:#1E2E28;--forest-deep:#16221D;--coral:#C85028;--btn:#C85028;--amber:#D9822B;--amber-d:#9E5A14;--plum:#4A235A;--success:#2D6A4F;--blue:#2F5D8A;
  --t-green:#E3F0E8;--t-coral:#FBE4DC;--t-amber:#FCEBD9;--t-plum:#EEE4F2;--t-blue:#E4ECF5;
  --shadow:0 1px 2px rgba(30,46,40,.05),0 10px 28px -14px rgba(30,46,40,.20);
  --head:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Raleway",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Red Hat Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#121A17;--surface:#1A2520;--surface-2:#22302A;--hl:#2B2520;--line:#2C3B34;--line-2:#42554C;
  --ink:#EDE8DF;--ink-2:#CFC9BE;--muted:#93A098;
  --coral:#EE8A66;--amber:#E9A05A;--amber-d:#E9A05A;--plum:#CFA9E0;--success:#7CC8A1;--blue:#8FB6DE;
  --t-green:#22392E;--t-coral:#46291E;--t-amber:#45341F;--t-plum:#3A2945;--t-blue:#25374B;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
code{font:500 .92em var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:5px}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.2px}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.ico{width:15px;height:15px;flex:none}
.banner{background:var(--amber);color:#16221D;font-size:12px;text-align:center;padding:3px 8px;font-weight:600}

/* top bar: dark forest band */
.top{display:flex;align-items:center;gap:22px;padding:0 24px;height:58px;background:var(--forest-deep);color:#F2ECE4;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 21px var(--head);width:216px;flex:none}
.brand em{color:#EE8A66;font-style:italic}
.tabs{display:flex;gap:4px;align-self:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;text-decoration:none;font-weight:600;font-size:14px;color:#B9C4BE;border-bottom:3px solid transparent;border-top:3px solid transparent}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#EE8A66}
.tab svg{width:15px;height:15px}
.grow{flex:1}
.search{position:relative;width:min(280px,24vw)}
.search input{width:100%;font:500 13px var(--body);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 12px 7px 34px;outline:none}
.search input::placeholder{color:#9FACA5}
.search input:focus{border-color:#EE8A66}
.search svg{position:absolute;left:12px;top:9px;width:14px;height:14px;color:#9FACA5}
.results{position:absolute;top:40px;left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 34px -12px rgba(0,0,0,.35);max-height:340px;overflow:auto;display:none}
.results.on{display:block}
.results a{display:block;padding:8px 12px;text-decoration:none;border-bottom:1px solid var(--line);font-weight:600}
.results a:hover{background:var(--hl)}
.results small{display:block;color:var(--muted);font-weight:500}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:none;color:#F2ECE4}
.by{font-size:11px;line-height:1.3;color:#9FACA5;text-align:right}
.by b{display:block;color:#F2ECE4;font-size:12px;font-weight:600}

/* layout */
.main{display:grid;grid-template-columns:248px minmax(0,1fr);gap:22px;padding:20px 24px 18px;max-width:1500px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px)}
.side-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px;font:700 17px var(--head)}
.side-h small{font:500 12px var(--body);color:var(--muted)}
.tree{overflow:auto}
.ch{display:flex;align-items:center;gap:10px;width:100%;padding:7px 6px;border:0;background:none;border-radius:10px;font-weight:700;text-align:left;font-size:14px}
.ch:hover{background:var(--surface-2)}
.ch .cv{order:9;margin-left:6px;color:var(--muted);transition:transform .15s}
.ch.open .cv{transform:rotate(90deg)}
.ch .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.cb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font:600 11px var(--mono);flex:none}
.lessons{margin:2px 0 8px 18px;padding-left:14px;border-left:2px solid var(--line);display:none}
.ch.open + .lessons{display:block}
.ls{display:flex;align-items:center;gap:9px;padding:5px 10px;margin:1px 0 1px -16px;border-left:2px solid transparent;text-decoration:none;font-size:13px;color:var(--ink-2)}
.ls:hover{color:var(--coral)}
.ls.on{border-left-color:var(--coral);color:var(--coral);font-weight:700;background:linear-gradient(90deg,var(--hl),transparent)}
.ls .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.ls.done .dot{background:var(--success)}
.progress{margin-top:auto;padding:12px 14px;display:flex;align-items:center;font-weight:700;font-size:12px}
.progress .bar{flex:1;height:6px;margin:0 10px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--success);width:0;transition:width .3s}
.progress span:last-child{font-family:var(--mono)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:14px;min-width:0}
.crumb{color:var(--coral);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.lh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lh h1,.page h1{font-size:36px;line-height:1.12;margin:4px 0 6px}
.lh p{margin:0;color:var(--muted);font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.o{background:var(--t-amber);color:var(--amber-d)}.pill.g{background:var(--t-green);color:var(--success)}.pill.v{background:var(--t-plum);color:var(--plum)}.pill.r{background:var(--t-coral);color:var(--coral)}.pill.b{background:var(--t-blue);color:var(--blue)}
/* step bar */
.steps{display:flex;gap:6px}
.sg{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--muted);font-size:12px;font-weight:600}
.sg i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px;transition:background .2s}
.sg span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.past i{background:var(--success)}
.sg.on i{background:var(--coral)}
.sg.on{color:var(--ink);font-weight:700}
.sg:hover{color:var(--ink)}
/* narration + stage */
.split{display:grid;grid-template-columns:minmax(290px,34%) minmax(0,1fr);gap:14px;align-items:stretch}
.narr{padding:20px 22px;display:flex;flex-direction:column}
.step-h{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.tag{font:700 10.5px var(--body);padding:2px 10px;border-radius:999px;background:var(--t-coral);color:var(--coral);letter-spacing:.8px}
.tag.RECAP,.tag.FIX,.tag.PLAN{background:var(--t-green);color:var(--success)}.tag.KEY{background:var(--t-plum);color:var(--plum)}.tag.NUMBERS,.tag.SETUP,.tag.BASELINE{background:var(--t-amber);color:var(--amber-d)}
.narr h2{font-size:25px;margin:14px 0 10px;line-height:1.2}
.narr p{margin:0 0 12px;color:var(--ink-2)}
.narr p a,.page p a{color:var(--coral);text-decoration:underline;text-underline-offset:3px}
.key{border-left:4px solid var(--coral);background:var(--hl);border-radius:0 12px 12px 0;padding:10px 14px;font:italic 600 16px/1.45 var(--head)}
.key small{display:block;font:700 10.5px var(--body);letter-spacing:.9px;color:var(--coral);text-transform:uppercase;margin-bottom:2px}
.extra{margin-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nav{margin-top:auto;padding-top:18px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--coral);color:var(--coral)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff;justify-content:space-between;padding:10px 16px}
.btn.pri:hover{background:#A9401D;color:#fff}
.btn.ghost{padding:10px 14px;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:520px}
.stage-top{display:flex;gap:0;padding:14px 16px 0;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:2}
.chip{padding:0 16px 0 0;margin:0 16px 8px 0;border-right:1px solid var(--line);max-width:210px}
.chip small{display:block;font-size:10.5px;letter-spacing:.7px;color:var(--muted);font-weight:700}
.chip b{font:600 15px/1.3 var(--mono);display:block}
.chip.new b{color:var(--coral);animation:pop .4s backwards}
.ctl{margin-left:auto;display:flex;gap:8px}
.canvas{flex:1;position:relative;min-height:400px}
.canvas svg{position:absolute;inset:0;width:100%;height:100%}
.brief{margin:0 16px 16px;background:var(--surface-2);border-radius:12px;padding:10px 14px;animation:pop .35s backwards;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.brief h4{margin:0;font:700 10.5px var(--body);letter-spacing:.8px;white-space:nowrap;color:var(--muted)}
.brief div{font-size:13px;display:flex;flex-wrap:wrap;gap:5px 8px;flex:1}
.brief span{border-radius:7px;padding:1px 10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
/* diagram */
.n{transition:opacity .3s;filter:drop-shadow(0 5px 7px rgba(30,46,40,.14))}
.n.dim{opacity:.32;filter:none}
.n.in{animation:rise .45s backwards}
.n text{font:700 15px var(--body);fill:#1E2E28;text-anchor:middle}
.n .tp{font:600 12.5px var(--mono);fill:#fff}
.edge{stroke:var(--ink);stroke-width:1.6;fill:none;opacity:.55}
.edge.fail{stroke:var(--coral);stroke-dasharray:6 5;opacity:1}
.flow{stroke:var(--coral);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;fill:none;animation:flow 1s linear infinite}
.flow.slow{animation-duration:3.2s}
.paused .flow{animation-play-state:paused}
.axis{font:700 13px var(--body);fill:var(--muted);text-anchor:middle;letter-spacing:.5px}
.bub rect{fill:var(--coral)}
.bub text{font:700 14px var(--body);fill:#fff;text-anchor:middle}
.bub{animation:pop .4s backwards;transform-origin:center;transform-box:fill-box}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
/* bars */
.bars{position:absolute;inset:0;padding:30px 36px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.bars .unit{font-size:11px;letter-spacing:.8px;color:var(--muted);font-weight:700;text-transform:uppercase}
.bar-row{display:grid;grid-template-columns:200px 1fr 100px;align-items:center;gap:14px;animation:rise .4s backwards}
.bar-row .tr{height:22px;border-radius:11px;background:var(--surface-2);overflow:hidden}
.bar-row .fl{height:100%;width:0;border-radius:11px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar-row b{font:600 16px var(--mono)}
.bar-row span{color:var(--ink-2);font-weight:600}
.bar-row.hot span,.bar-row.hot b{color:var(--coral);font-weight:700}
.empty{color:var(--line-2);text-align:center;font:700 72px var(--head)}
/* you'll learn strip */
.learn{padding:12px 18px;display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap}
.learn h3{margin:0;font:700 11px var(--body);letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.learn ul{margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;flex:1}
.learn li{list-style:none;display:flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.learn li i{width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
.learn li.ok{color:var(--ink);font-weight:600}
.learn li.ok i{background:var(--success);border-color:var(--success)}
.learn p{margin:0;font-size:12px}
.learn p a{color:var(--coral)}

/* pages */
.page{padding:24px 28px 28px;min-width:0}
.page>p.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.box{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:16px}
.box h3{margin:0 0 6px;font-size:18px;line-height:1.3}
.box p{margin:0 0 8px;font-size:13.5px;color:var(--ink-2)}
.box small{color:var(--muted);font-size:12px}
.num{font:700 30px var(--head);color:var(--coral);display:block}
a.box{text-decoration:none;display:block;transition:border-color .15s,transform .15s}
a.box:hover{border-color:var(--coral);transform:translateY(-2px)}
.lab-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sec{font-size:11px;letter-spacing:1px;font-weight:700;margin:24px 0 10px;color:var(--muted);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.field b{font-family:var(--mono);font-weight:600;color:var(--coral)}
.field select{font:600 13px var(--body);color:inherit;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
input[type=range]{accent-color:#C85028;width:100%}
.verdict{border-left:4px solid var(--coral);border-radius:0 12px 12px 0;padding:12px 16px;margin-top:16px;background:var(--t-coral)}
.verdict.ok{background:var(--t-green);border-left-color:var(--success)}
.verdict b{display:block;margin-bottom:4px;font:700 18px var(--head)}
.trow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px}
.trow b{display:block}
.trow small{display:block;color:var(--muted)}
.trow .why{color:var(--coral);font-weight:600}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{text-align:left;padding:14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg)}
.qb.on{border-color:var(--coral);background:var(--hl);box-shadow:inset 0 0 0 1px var(--coral)}
.qb b{display:block;font-size:11px;letter-spacing:.6px;color:var(--coral)}
.qb span{display:block;font:700 17px var(--head);margin:3px 0}
.qb small{color:var(--muted)}
.src{font-size:13px;margin:0;padding-left:0}
.src li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line)}
.src a{color:var(--coral)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.7px;color:var(--muted)}
.foot{grid-column:1/-1;font-size:11.5px;color:var(--muted);padding:4px 4px 0;text-align:center}

@media (max-width:1120px){.split{grid-template-columns:1fr}.stage{order:-1;min-height:0}.by{display:none}}
@media (max-width:820px){.main{grid-template-columns:1fr;padding:14px}.side{position:static;max-height:none}.top{flex-wrap:wrap;height:auto;padding:8px 14px;gap:8px}.brand{width:auto}.tabs{align-self:auto}.tab{padding:6px 8px}.tab svg{display:none}.search{width:100%;order:9}.bar-row{grid-template-columns:1fr;gap:4px}.canvas{min-height:240px}.sg span{display:none}.lh h1,.page h1{font-size:28px}}
</style>
</head>

  <div>
    <header class="top">

        <span>Open<em>Weights</em></span>

        <a class="tab" data-tab="labs" href="#/labs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9"/></svg>Labs</a>
        <a class="tab" data-tab="cheatsheets" href="#/cheatsheets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Cheatsheets</a>
      </nav>

          if (reg === 2 && m.origin !== 'US' && m.origin !== 'EU') { s = 'red'; badge = 'Origin policy gate'; why.push('Blocked by US/EU-only origin filter (' + m.origin + ')'); }
          if (reg === 3 && m.origin !== 'EU') {
            if (m.origin === 'US' && s !== 'red') { s = 'amber'; badge = 'US origin (host in EU VPC)'; why.push('US-origin checkpoint: deploy inside an EU sovereign VPC perimeter'); }
            else { s = 'red'; badge = 'Non-EU origin'; why.push('Restricted under strict EU-origin sovereign policy (' + m.origin + ')'); }
          }
          if (aud > m.auditLevel) {
            if (s !== 'red') { s = 'amber'; badge = aud === 3 ? 'Weights only (not Tier 4)' : 'Recipe undisclosed'; }
            why.push(aud === 3 ? 'Pre-training data corpus not publicly auditable' : 'Post-training recipe not fully disclosed');
          }
          cnt[s]++;
          return '<div class="trow"><div><b>' + esc(m.name) + '</b><small>' + esc(m.note) + '</small>' + (why.length ? '<small class="why">' + esc(why.join(' · ')) + '</small>' : '') + '</div><span class="pill ' + ({ green: 'g', amber: 'o', red: 'r' })[s] + '">' + esc(badge) + '</span></div>';
        }).join('');
        $('#tally').textContent = cnt.green + ' APPROVED · ' + cnt.amber + ' CONDITIONAL · ' + cnt.red + ' RESTRICTED';
      };
      ids.forEach((id) => { $('#' + id).onchange = up; }); up();
    } else {
      const pick = (q) => {
        document.querySelectorAll('.qb').forEach((b) => b.classList.toggle('on', b.dataset.q === q));
        const d = QUADRANTS[q];
        $('#qd').innerHTML = '<div class="lab-top"><span class="pill v">Quadrant ' + esc(d.name) + '</span><span class="pill o">' + esc(d.parts) + '</span></div><h3>' + esc(d.head) + '</h3><p>' + esc(d.desc) + '</p><div class="sec">REFERENCE STACK</div><p>' + esc(d.stack) + '</p><div class="links"><a class="btn" href="#/labs">' + I.ext + 'See the matching lab</a></div>';
        saved.q = q; store.set(saved);
      };
      document.querySelectorAll('.qb').forEach((b) => { b.onclick = () => pick(b.dataset.q); });
      pick(saved.q || '2');
    }
  }

  // ------------------------------------------------------------ labs + cheatsheets
  function labs() {
    return '<section class="card page"><div class="crumb">Labs</div><h1>The 7-Part Code & Video Series</h1><p class="sub">Each part turns a layer of the playbook into runnable Google Cloud code, with a short video walkthrough.</p><div class="grid g3">' +
      LABS.map((p) => '<div class="box"><div class="lab-top"><span class="pill ' + (p.live ? 'g' : '') + '">Part ' + p.n + '</span><small>' + esc(p.date) + (p.live ? ' · live' : ' · coming soon') + '</small></div><h3>' + esc(p.title) + '</h3><p>' + esc(p.desc) + '</p><small>' + esc(p.stack) + '</small>' +
        (p.links.length ? '<div class="links">' + p.links.map((x) => '<a class="btn" href="' + x[1] + '" target="_blank" rel="noopener">' + I.ext + esc(x[0]) + '</a>').join('') + '</div>' : '') + '</div>').join('') + '</div></section>';
  }
  function cheats() {
    const tiers = byId('release-tiers').steps.slice(1, 5), risks = byId('watch-outs').steps.slice(1, 8), lic = byId('license-triage').steps.slice(1, 4);
    return '<section class="card page"><div class="crumb">Cheatsheets</div><h1>Numbers Worth Memorising</h1><p class="sub">The whole playbook on one page. Click a number to open its lesson.</p><div class="grid g4">' +
      KEY_NUMBERS.map((k) => '<a class="box" href="#/learn/' + k[2] + '/1"><span class="num">' + esc(k[0]) + '</span><small>' + esc(k[1]) + '</small></a>').join('') + '</div>' +
      '<div class="sec">RELEASE TIERS</div><div class="box"><table><tr><th>TIER</th><th>WEIGHTS</th><th>TRAINING DATA</th><th>CAPS</th><th>BEST FIT</th><th>EXAMPLES</th></tr>' +
      tiers.map((s) => '<tr><td><b>' + esc(s.title) + '</b></td>' + s.chips.map((c) => '<td>' + esc(c) + '</td>').join('') + '<td>' + esc(s.brief.l.join(' · ')) + '</td></tr>').join('') + '</table></div>' +
      '<div class="sec">LICENCE BUCKETS</div><div class="box"><table><tr><th>BUCKET</th><th>STATUS</th><th>WATCH FOR</th><th>EXAMPLES</th></tr>' +
      lic.map((s) => '<tr><td><b>' + esc(s.title) + '</b></td><td>' + esc(s.chips[1]) + '</td><td>' + esc(s.chips[2]) + '</td><td>' + esc(s.brief.l.join(' · ')) + '</td></tr>').join('') + '</table></div>' +
      '<div class="sec">SEVEN WATCH-OUTS</div><div class="box"><table><tr><th>#</th><th>RISK</th><th>MITIGATION</th></tr>' +
      risks.map((s, k) => '<tr><td>' + (k + 1) + '</td><td><b>' + esc(s.title) + '</b></td><td>' + esc(s.chips[1]) + '</td></tr>').join('') + '</table></div>' +
      '<div class="sec">PRIMARY SOURCES</div><div class="box"><ul class="src">' + SOURCES.map((s) => '<li>' + md(s) + '</li>').join('') + '</ul></div></section>';
  }

  // ------------------------------------------------------------ render
  function render() {
    const r = parse();
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === r.tab));
    const main = $('#main');
    main.className = 'main' + (r.tab === 'learn' ? '' : ' wide');
    const body = r.tab === 'learn' ? learn(r) : r.tab === 'tools' ? tools(r) : r.tab === 'labs' ? labs() : cheats();
    if (r.tab !== 'learn') prev = { lesson: null, step: 0 };
    main.innerHTML = sidebar(r) + body + '<div class="foot"><span>Unofficial practitioner guide by Kanchana Patlolla & Anusha Sabbineni. Not an official Google Cloud publication. Licensing notes are for planning, not legal advice.</span></div>';
    if (r.tab === 'tools') wireTools(r);
    if (r.tab === 'learn') {
      growBars(main);
      $('#replay').onclick = () => { prev = { lesson: null, step: 0 }; paused = false; render(); };
      const pb = $('#pause');
      if (pb) pb.onclick = () => { paused = !paused; render(); };
    }
    document.title = (r.tab === 'learn' ? r.lesson.title : r.tab[0].toUpperCase() + r.tab.slice(1)) + ' · Open Weights';
  }
  document.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g && !g.disabled) { go(g.dataset.go); return; }
    const c = e.target.closest('.ch');
    if (c) c.classList.toggle('open');
    if (!e.target.closest('.search')) $('#results').classList.remove('on');
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,select,textarea')) return;
    const r = parse();
    if (r.tab !== 'learn') return;
    if (e.key === 'ArrowRight' && r.step < r.lesson.steps.length) go('#/learn/' + r.lesson.id + '/' + (r.step + 1));
    if (e.key === 'ArrowLeft' && r.step > 1) go('#/learn/' + r.lesson.id + '/' + (r.step - 1));
  });

  // search
  const INDEX = [];
  LESSONS.forEach((l) => {
    INDEX.push({ t: l.title, s: chapterOf(l).name + ' · lesson', h: '#/learn/' + l.id + '/1', k: (l.title + ' ' + l.sub + ' ' + l.learn.join(' ')).toLowerCase() });
    l.steps.forEach((s, i) => INDEX.push({ t: s.title, s: l.title + ' · step ' + (i + 1), h: '#/learn/' + l.id + '/' + (i + 1), k: (s.title + ' ' + s.body.join(' ') + ' ' + s.key).toLowerCase() }));
  });
  LABS.forEach((p) => INDEX.push({ t: 'Part ' + p.n + ': ' + p.title, s: 'Labs', h: '#/labs', k: (p.title + ' ' + p.desc + ' ' + p.stack).toLowerCase() }));
  [['Break-Even Calculator', 'breakeven'], ['License Triage', 'license'], ['Workload Router', 'router']].forEach((t) => INDEX.push({ t: t[0], s: 'Tools', h: '#/tools/' + t[1], k: t[0].toLowerCase() + ' tool calculator' }));
  const q = $('#q'), res = $('#results');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    if (v.length < 2) { res.classList.remove('on'); return; }
    const hits = INDEX.filter((x) => x.k.includes(v)).slice(0, 8);
    res.innerHTML = hits.length ? hits.map((x) => '<a href="' + x.h + '">' + esc(x.t) + '<small>' + esc(x.s) + '</small></a>').join('') : '<a>No matches</a>';
    res.classList.add('on');
  });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const a = res.querySelector('a[href]'); if (a) { go(a.getAttribute('href')); q.value = ''; res.classList.remove('on'); q.blur(); } } });
  res.addEventListener('click', () => { q.value = ''; res.classList.remove('on'); });

  // theme
  const setTheme = (t) => { document.documentElement.dataset.theme = t; saved.theme = t; store.set(saved); };
  if (saved.theme) document.documentElement.dataset.theme = saved.theme;
  $('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
